# Capped deliberately: this builds on the same box that serves the production
# API, and an unbounded Gradle/Kotlin daemon will happily take the RAM the
# live app needs.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=true
android.nonTransitiveRClass=true
