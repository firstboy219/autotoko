plugins { id 'com.android.application' }

// Signing is optional so the project still builds for anyone who clones it
// without the release key; only CI/the release box has keystore.properties.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'id.autotoko.scanner'
    compileSdk 34

    defaultConfig {
        applicationId "id.autotoko.scanner"
        minSdk 21
        targetSdk 34
        versionCode 15
        versionName "2.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { viewBinding false }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // Bundled (not the play-services variant) so OCR works with no Google
    // Play Services and no first-run model download — a warehouse phone on
    // patchy wifi must not be dependent on either.
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Barcode is the primary read: every courier label carries one and it
    // decodes exactly, which is what makes hands-free auto-submit safe.
    // Bundled variant, so it works with no Play Services and no first-run
    // model download.
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    testImplementation 'junit:junit:4.13.2'
}
