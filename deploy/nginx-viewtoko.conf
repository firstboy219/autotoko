server {
    server_name viewtoko.cosger.online;
    root /opt/autotoko/web;
    client_max_body_size 12m;
    index index.html;
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /opt/autotoko/admin/;
        try_files $uri $uri/ /admin/index.html;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
    # APK scanner. Deliberately NOT under /opt/autotoko/web: deploy-frontends.sh
    # rsyncs that directory with --delete, which silently removed the download
    # and broke the link the warehouse phones use.
    location /unduh/ {
        alias /opt/autotoko/downloads/;
        default_type application/vnd.android.package-archive;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Hashed build output never changes under the same name, so it can be kept
    # forever. index.html must NOT be: it is the only file that names the
    # current bundle, and with no Cache-Control at all the browser was free to
    # invent its own lifetime — which is how a deploy could ship and a user
    # keep running the previous build without knowing.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / { try_files $uri $uri/ /index.html; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/apitoko.cosger.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/apitoko.cosger.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = viewtoko.cosger.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name viewtoko.cosger.online;
    return 404; # managed by Certbot


}